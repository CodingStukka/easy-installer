[project]
name = "easy-installer"
version = "0.2.2"
description = "Install AppImages like real apps: menu entry, icon, uninstall - made for people new to Linux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://codingstukka.github.io/easy-installer/"
Source = "https://github.com/CodingStukka/easy-installer"
Issues = "https://github.com/CodingStukka/easy-installer/issues"

[project.scripts]
easy-installer = "easy_installer.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real: uses real AppImages found on this machine (skipped if absent)",
    "gui: needs GTK4/libadwaita and a display backend",
]
